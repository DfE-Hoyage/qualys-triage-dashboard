<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Qualys VMDR Triage Portal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div style="background-color: #fef3c7; color: #92400e; text-align: center; padding: 8px 16px; font-size: 0.85rem; border-bottom: 1px solid #fcd34d; font-weight: 500;">
    ⚠️ Academic Coursework Prototype — All vulnerability records, hostnames, and RFC 5737 IPs displayed are 100% synthetic test data.
  </div>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{{ url_for('frontend.dashboard') }}">Qualys VMDR Triage Portal</a>
      {% if session.get('user') %}
        <nav class="user-nav" aria-label="User navigation">
          <span class="user-nav__email">{{ session.get('user') }}</span>
          <a class="user-nav__logout" href="{{ url_for('frontend.logout') }}">Logout</a>
        </nav>
      {% endif %}
    </div>
  </header>
  <main class="page-container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
